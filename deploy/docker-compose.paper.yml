name: polibot-paper

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file:
      - ${POLIBOT_SECRETS_DIR:-/opt/polibot/secrets}/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polibot -d polibot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - polibot-postgres:/var/lib/postgresql/data
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  app:
    image: ${POLIBOT_IMAGE:?POLIBOT_IMAGE must be an immutable ECR digest URI}
    restart: unless-stopped
    env_file:
      - ${POLIBOT_SECRETS_DIR:-/opt/polibot/secrets}/runtime.env
    environment:
      POLIBOT_GIT_SHA: ${POLIBOT_GIT_SHA:?POLIBOT_GIT_SHA is required}
    command: ["uvicorn", "polibot.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3));
          assert data['healthy'] and data['execution_mode']=='paper' and not data['live_trading_enabled']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database
      - outbound

  worker:
    image: ${POLIBOT_IMAGE:?POLIBOT_IMAGE must be an immutable ECR digest URI}
    restart: unless-stopped
    env_file:
      - ${POLIBOT_SECRETS_DIR:-/opt/polibot/secrets}/runtime.env
    environment:
      POLIBOT_GIT_SHA: ${POLIBOT_GIT_SHA:?POLIBOT_GIT_SHA is required}
    command: ["python", "-m", "polibot.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "polibot.worker_health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - database
      - outbound

volumes:
  polibot-postgres:
    name: polibot-paper-postgres

networks:
  database:
    internal: true
  outbound:
