name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: python -m compileall -q src tests
      - run: alembic upgrade head --sql > /dev/null
      - run: python scripts/check_doc_links.py
      - run: docker compose config --quiet
      - run: docker build .
      - name: Validate safe default configuration
        run: python -c "from polibot.config import Settings; s=Settings(_env_file=None); assert s.execution_mode.value == 'paper' and not s.live_trading_enabled"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate
