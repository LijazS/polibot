name: Destroy PAPER AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY-POLIBOT-PAPER to permanently delete the PAPER stack
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: polibot-paper-deployment
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: infra/terraform/environments/paper
  REQUIRED_CONFIRMATION: DESTROY-POLIBOT-PAPER

jobs:
  destroy-plan:
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main and exact destructive confirmation
        shell: bash
        env:
          PROVIDED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Destruction is restricted to refs/heads/main." >&2
            exit 1
          }
          [[ "${PROVIDED_CONFIRMATION}" == "${REQUIRED_CONFIRMATION}" ]] || {
            echo "Confirmation did not exactly match ${REQUIRED_CONFIRMATION}." >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Authenticate to the expected account with OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: polibot-destroy-plan-${{ github.run_id }}
      - name: Preview the complete PAPER destruction
        shell: bash
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION_EXPECTED: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${actual_account}" == "${EXPECTED_ACCOUNT}" ]] || exit 1
          [[ "${AWS_REGION}" == "${AWS_REGION_EXPECTED}" ]] || exit 1
          printf 'Account=%s\nRegion=%s\nEnvironment=paper\nBackend=%s/%s\n' \
            "${actual_account}" "${AWS_REGION}" "${TF_STATE_BUCKET}" "${TF_STATE_KEY}"
          terraform -chdir="${TF_DIR}" fmt -check -recursive
          for attempt in 1 2 3; do
            terraform -chdir="${TF_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" && break
            [[ "${attempt}" -eq 3 ]] && exit 1
            sleep $((attempt * 5))
          done
          terraform -chdir="${TF_DIR}" validate
          state_objects="$(terraform -chdir="${TF_DIR}" state list)"
          [[ -n "${state_objects}" ]] || {
            echo "Remote PAPER state contains no objects; refusing a misleading destroy run." >&2
            exit 1
          }
          terraform -chdir="${TF_DIR}" plan -destroy -input=false -lock-timeout=5m \
            -var="allow_destructive_destroy=true" -no-color
      - name: Destruction preview summary
        shell: bash
        run: |
          {
            echo "## PAPER destroy preview"
            echo "- This run has not destroyed anything yet."
            echo "- The apply job is separately protected by the paper environment."
            echo "- It first records the explicit non-empty S3/ECR deletion flags in Terraform state."
            echo "- EC2/local PostgreSQL, application S3 data, ECR images, logs, and networking will be deleted."
            echo "- The Terraform state bucket and GitHub OIDC bootstrap roles are preserved."
          } >> "${GITHUB_STEP_SUMMARY}"

  protected-destroy:
    needs: destroy-plan
    runs-on: ubuntu-latest
    environment: paper
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reconfirm main and destructive intent
        shell: bash
        env:
          PROVIDED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${PROVIDED_CONFIRMATION}" == "${REQUIRED_CONFIRMATION}" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Authenticate to the expected account with OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: polibot-destroy-${{ github.run_id }}
      - name: Destroy the reviewed PAPER stack
        shell: bash
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION_EXPECTED: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "${EXPECTED_ACCOUNT}" ]] || exit 1
          [[ "${AWS_REGION}" == "${AWS_REGION_EXPECTED}" ]] || exit 1
          for attempt in 1 2 3; do
            terraform -chdir="${TF_DIR}" init -reconfigure -input=false \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" && break
            [[ "${attempt}" -eq 3 ]] && exit 1
            sleep $((attempt * 5))
          done
          state_objects="$(terraform -chdir="${TF_DIR}" state list)"
          [[ -n "${state_objects}" ]] || {
            echo "Remote PAPER state contains no objects; refusing a misleading destroy run." >&2
            exit 1
          }
          terraform -chdir="${TF_DIR}" plan -input=false -lock-timeout=5m \
            -target=aws_s3_bucket.data -target=aws_ecr_repository.app \
            -var="allow_destructive_destroy=true" -out=arm-destroy.tfplan
          terraform -chdir="${TF_DIR}" apply -input=false -lock-timeout=5m arm-destroy.tfplan
          terraform -chdir="${TF_DIR}" plan -destroy -input=false -lock-timeout=5m \
            -var="allow_destructive_destroy=true" -out=destroy.tfplan
          terraform -chdir="${TF_DIR}" show -no-color destroy.tfplan
          terraform -chdir="${TF_DIR}" apply -input=false -lock-timeout=5m destroy.tfplan
          remaining="$(terraform -chdir="${TF_DIR}" state list)"
          [[ -z "${remaining}" ]] || {
            echo "Terraform state still contains objects after destroy:" >&2
            echo "${remaining}" >&2
            exit 1
          }
      - name: Destruction result
        if: always()
        shell: bash
        run: |
          {
            echo "## Polibot PAPER destruction"
            echo "- AWS account: ${{ vars.AWS_ACCOUNT_ID }}"
            echo "- AWS region: ${{ vars.AWS_REGION }}"
            echo "- Result: ${{ job.status }}"
            echo "- Terraform state bucket and OIDC bootstrap roles were not targeted."
          } >> "${GITHUB_STEP_SUMMARY}"
